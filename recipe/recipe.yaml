schema_version: 1

context:
  version: "0.2"
  sha256: ec4acbd8cde6ceeb2be67eda1f46c709758af6db35cacbcde41baac349855e25

package:
  name: su-exec
  version: ${{ version }}

source:
  url: https://github.com/ncopa/su-exec/archive/v${{ version }}.tar.gz
  sha256: ${{ sha256 }}

build:
  number: 1004
  skip: not linux

requirements:
  build:
    - ${{ compiler("c") }}
    - ${{ stdlib("c") }}
    - make

tests:
  - script:
      - which su-exec
      - su-exec --help

about:
  license: MIT
  license_file: LICENSE
  summary: Switch user and group id and exec
  description: |
    This is a simple tool that will simply execute a program with different
    privileges. The program will not run as a child, like su and sudo, so we
    work around TTY and signal issues.

  homepage: https://github.com/ncopa/su-exec
  repository: https://github.com/ncopa/su-exec
  documentation: https://github.com/ncopa/su-exec

extra:
  recipe-maintainers:
    - jakirkham
